<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Home</title>
  <link rel="stylesheet" href="css/style.css" />
</head>
<body>
  <a class="skip-link" href="#main">Skip to content</a>

  <header class="site-header">
    <div class="logo-wrap">
      <a href="index.html" aria-label="Go to Home">
        <img class="logo" src="images/logo.png" alt="ComputerForce logo" />
      </a>
    </div>
  </header>

  <nav class="site-nav" aria-label="Primary">
    <div class="nav-inner">
      <button class="hamburger" aria-label="Toggle menu">
  ☰
</button>

      <div class="menu-left" data-menu-links>
        <a href="index.html">Home</a>
        <a href="products.html">Products</a>
        <a href="register.html">Register</a>
        <a href="about.html">About</a>
        <a href="joyce/index.html">Joyce</a>
      </div>

      <form class="search-right" data-search-area data-search-form>
        <input type="text" name="q" placeholder="Search…" aria-label="Search term" />
        <button type="submit">Search</button>
      </form>
    </div>
  </nav>

  <div class="layout">
    <main id="main">
      <h1>Welcome to Computer Force</h1>
      <p>Computer Force is your online expert in all things computing</p>

      <div class="section-grid" aria-label="Main product categories">
        <div class="card">
         <h2>Audio</h2>
         <img src="images/audio.jpeg" alt="Audio category" />
        </div>
        <div class="card">
          <h2>Computers</h2>
          <img src="images/computers.webp" alt="Computers category" />
        </div>
        <div class="card">
          <h2>Graphics cards</h2>
          <img src="images/graphicscards.jpeg" alt="Graphics cards category" />
        </div>
        <div class="card">
          <h2>Keyboard and mice</h2>
          <img src="images/keyboard.jpg" alt="Keyboard and mice category" />
        </div>
        <div class="card">
          <h2>Laptops</h2>
          <img src="images/laptops.jpg" alt="Laptops category" />
        </div>
        <div class="card">
          <h2>Monitors</h2>
        <img src="images/monitors.jpeg" alt="Monitors category" />
        </div>
        
      </div>
    </main>

    <aside data-aside-panel>
      <h2>Purchases</h2>

      <table class="purchases" aria-label="Cart table">
        <tbody id="cart-items">
          <tr><td>0 items</td><td>Cart sub-total: $0</td></tr>
        </tbody>
      </table>

      <button class="checkout-btn" type="button" id="checkout-btn">Go to Checkout</button>
      <button class="checkout-btn" type="button" id="clear-cart-btn" style="margin-top:10px;background:#e5e7eb;color:#111;">
        Clear Cart
      </button>
    </aside>
  </div>


  <footer class="site-footer">
    <div class="footer-inner">
      <p>&copy; 2026 Joyce</p>
    </div>
  </footer>
  <script src="js/script.js"></script>
</body>
</html>
